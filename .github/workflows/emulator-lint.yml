# TEMPORARY (real-task PR E only, removed before merge): sh -n and shellcheck on the emulator scripts,
# which can't run on the phone this PR was written on.
name: Emulator scripts lint (temporary)

on:
  pull_request:
    paths:
      - "tools/emulator/**"
      - ".github/workflows/emulator-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: sh -n
        run: |
          for f in tools/emulator/*.sh; do sh -n "$f" && echo "sh -n $f: ok"; done
      - name: shellcheck -s sh
        run: |
          shellcheck --version | head -2
          shellcheck -s sh -x tools/emulator/*.sh
