# Emulator smoke for Mode for Android: boots an Android emulator on a GitHub runner, installs the debug
# build, turns phone control on over adb and drives the engine through the debug probe (DevProbe), steps
# S1 to S9 in tools/emulator/smoke.sh. Every run, pass or fail, uploads the evidence as an artifact
# (summary.md, a screenshot per step, the screen recording, logs) and puts summary.md in the job summary.
# Informational: the Tests workflow stays the required check. How to start a run and read it:
# docs/android.md, "Emulator smoke in CI".
#   gh workflow run android-emulator.yml -R heymode/mode [--ref <branch>] [-f api-level=35] [-f skip=S4]
# No secrets, a read-only token and no pull_request_target, so it is safe on pull requests from forks.
name: Android emulator smoke

on:
  pull_request:
    paths:
      - "app/android/**"
      - "app/graph/**"
      - "engine/phone-android/**"
      - "engine/adb-link/**"
      - "engine/adb-helper/**"
      - "feature/connection/**"
      - "core/platform/**"
      - "tools/emulator/**"
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level of the emulator image
        type: choice
        options: ["37.0", "36", "35", "34"]
        default: "36"
      skip:
        description: Steps to skip, for example "S4" (the sensitivity check)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Per ref and level, so two dispatches on one branch at different levels do not cancel each other.
  group: android-emulator-${{ github.ref }}-${{ inputs.api-level || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # As in ci.yml: the action's default also asks for "tools", which the SDK no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK (the probe is in debug builds only)
        run: ./gradlew :app:android:assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mode-debug-apk
          path: app/android/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Say where it stopped
        if: failure()
        run: echo "**Stopped at the build:** no debug APK, so no emulator ran. See this job's log." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Default 36: on #9, 34, 35 and 36 all passed once the script waits for boot broadcasts; 36 is the
        # plan's pick on a tie. 37.0 timed out at boot twice. A dispatched run uses the level asked for:
        # 34, 35, 36 or 37.0.
        # Android 17 is written 37.0: Google publishes only android-37.0, and the action passes the
        # level straight into the package name.
        api-level: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.api-level) || '["36"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mode-debug-apk
          path: apk
      - name: Enable KVM
        # From the emulator action's README: lets the runner user open /dev/kvm.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator and smoke
        # The action shuts the emulator down when its script ends and runs each script line in its own
        # shell, so the script is one line and smoke.sh pulls everything off the emulator itself.
        # Defaults kept on purpose: software graphics (swiftshader_indirect), no window, 600 s boot timeout.
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          # The input reaches the script through the environment, never written into a command.
          SMOKE_SKIP: ${{ inputs.skip || 'S4' }} # TEMPORARY sensitivity run, reverted next commit
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh tools/emulator/smoke.sh "$(ls apk/*.apk | head -1)" out
      - name: Does the recording play
        # Best effort, never fails the job: decodes every frame of each mp4 and says so in summary.md.
        if: always()
        continue-on-error: true
        run: |
          set -u
          ls out/mode-smoke-*.mp4 > /dev/null 2>&1 || exit 0
          { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; } > /dev/null 2>&1 || { echo "- Recording check: ffmpeg did not install." >> out/summary.md; exit 0; }
          for f in out/mode-smoke-*.mp4; do
            secs=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" || echo "?")
            if ffmpeg -v error -i "$f" -f null - 2> "$f.check.txt"; then
              echo "- Recording check: $(basename "$f") plays, ${secs} s." >> out/summary.md
            else
              echo "- Recording check: $(basename "$f") does not decode: $(head -1 "$f.check.txt")" >> out/summary.md
            fi
          done
      - name: Results in the job summary
        if: always()
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          if [ -f out/summary.md ]; then
            cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**API $API_LEVEL: stopped before the smoke script** (the image did not install or the emulator did not boot). See this job's log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-api-${{ matrix.api-level }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
