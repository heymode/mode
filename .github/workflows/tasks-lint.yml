# TEMPORARY (PR #18 only, removed before merge): sh -n, shellcheck, actionlint and the self-test for the
# review fixes; none of them runs on the phone this PR is written on.
name: Real tasks lint (temporary)

on:
  pull_request:
    paths:
      - "tools/emulator/**"
      - ".github/workflows/android-emulator-tasks.yml"
      - ".github/workflows/tasks-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: sh -n, shellcheck, the self-test
        run: |
          for f in tools/emulator/*.sh; do sh -n "$f" && echo "sh -n $f: ok"; done
          shellcheck -s sh -x tools/emulator/lib.sh tools/emulator/smoke.sh tools/emulator/tasks.sh
          sh tools/emulator/tasks.sh --self-test
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/android-emulator-tasks.yml
