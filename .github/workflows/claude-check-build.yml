# TEMPORARY (PR #12 only, removed before merge): proves tools/claude-check compiles and runs, and that
# a normal build does not include it. No secret and no Environment: the check runs with no token and
# must print only "NoToken".
name: Claude check build (temporary)

on:
  pull_request:
    paths:
      - "tools/claude-check/**"
      - "settings.gradle.kts"
      - ".github/workflows/claude-check*.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: A normal build has no claude-check module
        run: |
          ./gradlew -q projects > projects.txt
          if grep -q claude-check projects.txt; then echo "claude-check is in a normal build"; exit 1; fi
          echo "Not in a normal build: OK"
      - name: With -PclaudeCheck it builds
        run: |
          ./gradlew -q -PclaudeCheck projects | grep claude-check
          ./gradlew -PclaudeCheck --no-configuration-cache :tools:claude-check:checkLibs
      - name: With no token it prints only NoToken
        run: |
          out=$(java -cp 'tools/claude-check/build/check-libs/*' com.piyush.mode.tools.claudecheck.MainKt 2>&1)
          printf '%s\n' "$out"
          [ "$out" = NoToken ]
