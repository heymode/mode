# Puts heymode.app live: builds the website and deploys it with wrangler from website/.
# Started by hand only: Actions → Deploy website → Run workflow. Never on push or pull request, because
# when the site goes live is the owner's call (the Android button waits on the release-APK install check).
#
# What actually protects this is the GitHub Environment "website" (Settings → Environments), not this file:
# it allows only the main branch and needs the owner's approval for every run. The `if:` below is only a
# convenience; anyone who can push a branch could change it.
#   CLOUDFLARE_API_TOKEN   an API token that can deploy the "heymode" Worker on heymode.app
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the Worker is in
# The token is given only to the wrangler deploy step; install, build and checks never see it.
# Without the secrets the run stops at the first step and deploys nothing.
#
# The stats dashboard (stats/) is a separate Worker and is not deployed here.
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      apk_check_passed:
        description: "The release-APK install check on a real Android phone passed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: website
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: website
    steps:
      - name: Ready to deploy?
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          APK_CHECK_PASSED: ${{ inputs.apk_check_passed }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not deployed: the 'website' environment has no secret named$missing. Add it in Settings → Environments → website."
            exit 1
          fi
          if [ "$APK_CHECK_PASSED" != "true" ]; then
            echo "::error::Not deployed: tick 'The release-APK install check … passed' when you run the workflow."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build (no secrets)
        run: |
          npm run build
          npx --yes wrangler@4 --version   # fetch wrangler before the token is in the environment
      - name: Deploy (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      # Informational only: a failure here never turns a good deploy red.
      - name: Check the live Android download
        working-directory: .
        run: |
          sleep 20
          h=$(curl -sSI --max-time 30 https://heymode.app/download/android || true)
          echo "$h" | grep -iE '^(HTTP|content-type|content-disposition|x-mode-release)' || true
          echo "$h" | grep -qi 'application/vnd.android.package-archive' \
            || echo "::warning::heymode.app/download/android isn't serving the APK yet. Check it on the phone."
